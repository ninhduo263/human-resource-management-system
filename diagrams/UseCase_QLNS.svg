<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 980" width="1440" height="980" style="background:#F8FAF9;font-family:Arial,Helvetica,sans-serif;">
  <defs>
    <style>
      .title { font-size: 24px; font-weight: bold; fill: #0D392F; }
      .subtitle { font-size: 14px; fill: #155E4B; }
      .pkg-title { font-size: 15px; font-weight: bold; fill: #0D392F; }
      .actor-label { font-size: 13px; font-weight: bold; fill: #0D392F; text-anchor: middle; }
      .actor-sub { font-size: 11px; fill: #5E7066; text-anchor: middle; }
      .uc-text { font-size: 11.5px; fill: #172B23; text-anchor: middle; }
      .uc-code { font-size: 11px; font-weight: bold; fill: #155E4B; text-anchor: middle; }
      .line { stroke: #5E7066; stroke-width: 1.5; }
      .line-inc { stroke: #2563EB; stroke-width: 1.2; stroke-dasharray: 4 3; }
      .inc-text { font-size: 10px; fill: #2563EB; text-anchor: middle; font-style: italic; }
    </style>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="1" dy="2" stdDeviation="3" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Header -->
  <rect x="30" y="20" width="1380" height="60" rx="8" fill="#EAF1E2" stroke="#D5DFD0" stroke-width="1"/>
  <text x="50" y="48" class="title">SƠ ĐỒ USE CASE TỔNG QUAN — HỆ THỐNG QUẢN LÝ NHÂN SỰ (PeopleOps HRMS)</text>
  <text x="50" y="68" class="subtitle">Mô tả 4 Tác nhân nghiệp vụ (Actors) và 20 Chức năng (Use Cases) tương ứng 5 phân hệ BFD 1.0 – 5.0</text>

  <!-- BOUNDARY SYSTEM BOX -->
  <rect x="240" y="95" width="960" height="860" rx="14" fill="#FFFFFF" stroke="#155E4B" stroke-width="2" filter="url(#shadow)"/>
  <rect x="240" y="95" width="340" height="32" rx="6" fill="#155E4B"/>
  <text x="255" y="117" font-size="14" font-weight="bold" fill="#FFFFFF">Ranh giới Hệ thống PeopleOps HRMS</text>

  <!-- ================= SUB-PACKAGES ================= -->
  <!-- 1.0 Ho so -->
  <rect x="260" y="140" width="445" height="145" rx="8" fill="#F6F7F3" stroke="#D5DFD0" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="275" y="162" class="pkg-title">1.0 Quản lý hồ sơ nhân viên</text>

  <!-- 2.0 Phong ban & Chuc vu -->
  <rect x="735" y="140" width="445" height="145" rx="8" fill="#F6F7F3" stroke="#D5DFD0" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="750" y="162" class="pkg-title">2.0 Quản lý phòng ban &amp; chức vụ</text>

  <!-- 3.0 Hop dong lao dong -->
  <rect x="260" y="300" width="445" height="165" rx="8" fill="#F6F7F3" stroke="#D5DFD0" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="275" y="322" class="pkg-title">3.0 Quản lý hợp đồng lao động</text>

  <!-- 4.0 Cong tac & Nghi phep -->
  <rect x="735" y="300" width="445" height="165" rx="8" fill="#F6F7F3" stroke="#D5DFD0" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="750" y="322" class="pkg-title">4.0 Quản lý công tác &amp; nghỉ phép</text>

  <!-- 5.0 Bao cao nhan su -->
  <rect x="260" y="480" width="920" height="150" rx="8" fill="#F6F7F3" stroke="#D5DFD0" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="275" y="502" class="pkg-title">5.0 Báo cáo thống kê nhân sự</text>

  <!-- Phụ trợ: Quyet dinh, Phu luc, Phép năm, Bao mat -->
  <rect x="260" y="645" width="920" height="290" rx="8" fill="#F0F4EF" stroke="#C9F3BD" stroke-width="1.5"/>
  <text x="275" y="670" class="pkg-title" fill="#0D392F">Hạ tầng Phụ trợ Nghiệp vụ (GIAHANHOPDONG, QUYETDINH, SONGAYPHEP &amp; RBAC)</text>

  <!-- ================= USE CASES ================= -->
  <!-- UC 1.1 - 1.4 -->
  <g transform="translate(370, 205)">
    <ellipse cx="0" cy="0" rx="95" ry="22" fill="#FFFFFF" stroke="#0D392F" stroke-width="1.5"/>
    <text y="-3" class="uc-code">UC 1.1</text><text y="12" class="uc-text">Thêm hồ sơ mới</text>
  </g>
  <g transform="translate(590, 205)">
    <ellipse cx="0" cy="0" rx="95" ry="22" fill="#FFFFFF" stroke="#0D392F" stroke-width="1.5"/>
    <text y="-3" class="uc-code">UC 1.2</text><text y="12" class="uc-text">Cập nhật hồ sơ</text>
  </g>
  <g transform="translate(370, 258)">
    <ellipse cx="0" cy="0" rx="95" ry="22" fill="#FFFFFF" stroke="#0D392F" stroke-width="1.5"/>
    <text y="-3" class="uc-code">UC 1.3</text><text y="12" class="uc-text">Tra cứu nhân viên</text>
  </g>
  <g transform="translate(590, 258)">
    <ellipse cx="0" cy="0" rx="95" ry="22" fill="#FFFFFF" stroke="#0D392F" stroke-width="1.5"/>
    <text y="-3" class="uc-code">UC 1.4</text><text y="12" class="uc-text">Lưu trữ hồ sơ</text>
  </g>

  <!-- UC 2.1 - 2.4 -->
  <g transform="translate(845, 205)">
    <ellipse cx="0" cy="0" rx="95" ry="22" fill="#FFFFFF" stroke="#0D392F" stroke-width="1.5"/>
    <text y="-3" class="uc-code">UC 2.1</text><text y="12" class="uc-text">Quản lý phòng ban</text>
  </g>
  <g transform="translate(1065, 205)">
    <ellipse cx="0" cy="0" rx="95" ry="22" fill="#FFFFFF" stroke="#0D392F" stroke-width="1.5"/>
    <text y="-3" class="uc-code">UC 2.2</text><text y="12" class="uc-text">Quản lý chức vụ</text>
  </g>
  <g transform="translate(845, 258)">
    <ellipse cx="0" cy="0" rx="95" ry="22" fill="#FFFFFF" stroke="#0D392F" stroke-width="1.5"/>
    <text y="-3" class="uc-code">UC 2.3</text><text y="12" class="uc-text">Phân bổ nhân sự</text>
  </g>
  <g transform="translate(1065, 258)">
    <ellipse cx="0" cy="0" rx="95" ry="22" fill="#FFFFFF" stroke="#0D392F" stroke-width="1.5"/>
    <text y="-3" class="uc-code">UC 2.4</text><text y="12" class="uc-text">Bổ nhiệm chức vụ</text>
  </g>

  <!-- UC 3.1 - 3.4 -->
  <g transform="translate(370, 365)">
    <ellipse cx="0" cy="0" rx="95" ry="22" fill="#FFFFFF" stroke="#0D392F" stroke-width="1.5"/>
    <text y="-3" class="uc-code">UC 3.1</text><text y="12" class="uc-text">Lập hợp đồng mới</text>
  </g>
  <g transform="translate(590, 365)">
    <ellipse cx="0" cy="0" rx="95" ry="22" fill="#FFFFFF" stroke="#0D392F" stroke-width="1.5"/>
    <text y="-3" class="uc-code">UC 3.2</text><text y="12" class="uc-text">Gia hạn hợp đồng</text>
  </g>
  <g transform="translate(370, 425)">
    <ellipse cx="0" cy="0" rx="95" ry="22" fill="#FFFFFF" stroke="#0D392F" stroke-width="1.5"/>
    <text y="-3" class="uc-code">UC 3.3</text><text y="12" class="uc-text">Chấm dứt hợp đồng</text>
  </g>
  <g transform="translate(590, 425)">
    <ellipse cx="0" cy="0" rx="95" ry="22" fill="#FFFFFF" stroke="#0D392F" stroke-width="1.5"/>
    <text y="-3" class="uc-code">UC 3.4</text><text y="12" class="uc-text">Cảnh báo hết hạn HĐ</text>
  </g>

  <!-- UC 4.1 - 4.4 -->
  <g transform="translate(845, 365)">
    <ellipse cx="0" cy="0" rx="95" ry="22" fill="#FFFFFF" stroke="#0D392F" stroke-width="1.5"/>
    <text y="-3" class="uc-code">UC 4.1</text><text y="12" class="uc-text">Ghi nhận công tác</text>
  </g>
  <g transform="translate(1065, 365)">
    <ellipse cx="0" cy="0" rx="95" ry="22" fill="#FFFFFF" stroke="#0D392F" stroke-width="1.5"/>
    <text y="-3" class="uc-code">UC 4.2</text><text y="12" class="uc-text">Đăng ký nghỉ phép</text>
  </g>
  <g transform="translate(845, 425)">
    <ellipse cx="0" cy="0" rx="95" ry="22" fill="#FFFFFF" stroke="#0D392F" stroke-width="1.5"/>
    <text y="-3" class="uc-code">UC 4.3</text><text y="12" class="uc-text">Duyệt nghỉ phép</text>
  </g>
  <g transform="translate(1065, 425)">
    <ellipse cx="0" cy="0" rx="95" ry="22" fill="#FFFFFF" stroke="#0D392F" stroke-width="1.5"/>
    <text y="-3" class="uc-code">UC 4.4</text><text y="12" class="uc-text">Theo dõi ngày phép</text>
  </g>

  <!-- UC 5.1 - 5.4 -->
  <g transform="translate(370, 560)">
    <ellipse cx="0" cy="0" rx="95" ry="22" fill="#FFFFFF" stroke="#0D392F" stroke-width="1.5"/>
    <text y="-3" class="uc-code">UC 5.1</text><text y="12" class="uc-text">Thống kê nhân sự</text>
  </g>
  <g transform="translate(590, 560)">
    <ellipse cx="0" cy="0" rx="95" ry="22" fill="#FFFFFF" stroke="#0D392F" stroke-width="1.5"/>
    <text y="-3" class="uc-code">UC 5.2</text><text y="12" class="uc-text">Báo cáo biến động</text>
  </g>
  <g transform="translate(845, 560)">
    <ellipse cx="0" cy="0" rx="95" ry="22" fill="#FFFFFF" stroke="#0D392F" stroke-width="1.5"/>
    <text y="-3" class="uc-code">UC 5.3</text><text y="12" class="uc-text">Báo cáo hợp đồng</text>
  </g>
  <g transform="translate(1065, 560)">
    <ellipse cx="0" cy="0" rx="95" ry="22" fill="#FFFFFF" stroke="#0D392F" stroke-width="1.5"/>
    <text y="-3" class="uc-code">UC 5.4</text><text y="12" class="uc-text">Báo cáo nghỉ phép</text>
  </g>

  <!-- Supporting Use cases -->
  <g transform="translate(440, 725)">
    <ellipse cx="0" cy="0" rx="125" ry="25" fill="#E8F5E9" stroke="#2E7D32" stroke-width="1.5"/>
    <text y="-3" class="uc-code" fill="#2E7D32">Lập Phụ lục Gia hạn &amp; Lương</text>
    <text y="12" class="uc-text">(Bảng GIAHANHOPDONG / extensions)</text>
  </g>
  <g transform="translate(720, 725)">
    <ellipse cx="0" cy="0" rx="125" ry="25" fill="#E8F5E9" stroke="#2E7D32" stroke-width="1.5"/>
    <text y="-3" class="uc-code" fill="#2E7D32">Ban hành Quyết định 1–N</text>
    <text y="12" class="uc-text">(Bảng QUYETDINH / decisions)</text>
  </g>
  <g transform="translate(1000, 725)">
    <ellipse cx="0" cy="0" rx="125" ry="25" fill="#E8F5E9" stroke="#2E7D32" stroke-width="1.5"/>
    <text y="-3" class="uc-code" fill="#2E7D32">Tự động Khấu trừ Quỹ phép</text>
    <text y="12" class="uc-text">(Bảng SONGAYPHEP &amp; v_songayphep)</text>
  </g>

  <g transform="translate(560, 835)">
    <ellipse cx="0" cy="0" rx="120" ry="22" fill="#EDE7F6" stroke="#5E35B1" stroke-width="1.5"/>
    <text y="-3" class="uc-code" fill="#5E35B1">Xác thực &amp; Phân quyền 5 vai trò</text>
    <text y="12" class="uc-text">(users, sessions, RBAC/ABAC)</text>
  </g>
  <g transform="translate(880, 835)">
    <ellipse cx="0" cy="0" rx="120" ry="22" fill="#EDE7F6" stroke="#5E35B1" stroke-width="1.5"/>
    <text y="-3" class="uc-code" fill="#5E35B1">Ghi vết Nhật ký Kiểm toán</text>
    <text y="12" class="uc-text">(audit_log kèm IP &amp; details JSON)</text>
  </g>

  <!-- Include connectors -->
  <path d="M 590,387 C 565,490 480,650 445,700" class="line-inc"/>
  <text x="490" y="540" class="inc-text">&lt;&lt;include&gt;&gt;</text>

  <path d="M 845,387 C 805,490 755,650 730,700" class="line-inc"/>
  <text x="760" y="540" class="inc-text">&lt;&lt;include&gt;&gt;</text>

  <path d="M 865,447 C 895,525 965,650 990,700" class="line-inc"/>
  <text x="945" y="580" class="inc-text">&lt;&lt;include&gt;&gt;</text>

  <!-- ================= ACTORS ================= -->
  <!-- ACTOR 1: Cán bộ nhân sự (Left, y=260) -->
  <g transform="translate(110, 260)">
    <circle cx="0" cy="-35" r="16" fill="#C9F3BD" stroke="#0D392F" stroke-width="2"/>
    <line x1="0" y1="-19" x2="0" y2="15" stroke="#0D392F" stroke-width="2.5"/>
    <line x1="-20" y1="-5" x2="20" y2="-5" stroke="#0D392F" stroke-width="2.5"/>
    <line x1="0" y1="15" x2="-16" y2="45" stroke="#0D392F" stroke-width="2.5"/>
    <line x1="0" y1="15" x2="16" y2="45" stroke="#0D392F" stroke-width="2.5"/>
    <text y="65" class="actor-label">Cán bộ nhân sự</text>
    <text y="80" class="actor-sub">(HR / Quản trị viên)</text>
  </g>

  <!-- ACTOR 2: Nhân viên (Left, y=480) -->
  <g transform="translate(110, 480)">
    <circle cx="0" cy="-35" r="16" fill="#C9F3BD" stroke="#0D392F" stroke-width="2"/>
    <line x1="0" y1="-19" x2="0" y2="15" stroke="#0D392F" stroke-width="2.5"/>
    <line x1="-20" y1="-5" x2="20" y2="-5" stroke="#0D392F" stroke-width="2.5"/>
    <line x1="0" y1="15" x2="-16" y2="45" stroke="#0D392F" stroke-width="2.5"/>
    <line x1="0" y1="15" x2="16" y2="45" stroke="#0D392F" stroke-width="2.5"/>
    <text y="65" class="actor-label">Nhân viên</text>
    <text y="80" class="actor-sub">(Employee)</text>
  </g>

  <!-- ACTOR 3: Trưởng phòng (Right, y=340) -->
  <g transform="translate(1320, 340)">
    <circle cx="0" cy="-35" r="16" fill="#C9F3BD" stroke="#0D392F" stroke-width="2"/>
    <line x1="0" y1="-19" x2="0" y2="15" stroke="#0D392F" stroke-width="2.5"/>
    <line x1="-20" y1="-5" x2="20" y2="-5" stroke="#0D392F" stroke-width="2.5"/>
    <line x1="0" y1="15" x2="-16" y2="45" stroke="#0D392F" stroke-width="2.5"/>
    <line x1="0" y1="15" x2="16" y2="45" stroke="#0D392F" stroke-width="2.5"/>
    <text y="65" class="actor-label">Trưởng phòng</text>
    <text y="80" class="actor-sub">(Manager)</text>
  </g>

  <!-- ACTOR 4: Ban giám đốc (Right, y=530) -->
  <g transform="translate(1320, 530)">
    <circle cx="0" cy="-35" r="16" fill="#C9F3BD" stroke="#0D392F" stroke-width="2"/>
    <line x1="0" y1="-19" x2="0" y2="15" stroke="#0D392F" stroke-width="2.5"/>
    <line x1="-20" y1="-5" x2="20" y2="-5" stroke="#0D392F" stroke-width="2.5"/>
    <line x1="0" y1="15" x2="-16" y2="45" stroke="#0D392F" stroke-width="2.5"/>
    <line x1="0" y1="15" x2="16" y2="45" stroke="#0D392F" stroke-width="2.5"/>
    <text y="65" class="actor-label">Ban giám đốc</text>
    <text y="80" class="actor-sub">(Director)</text>
  </g>

  <!-- ================= ASSOCIATIONS ================= -->
  <!-- Cán bộ nhân sự -> 1.1, 1.2, 1.3, 1.4, 2.1, 2.2, 3.1, 3.2, 3.3, 4.1, 5.1-5.4 -->
  <line x1="170" y1="240" x2="275" y2="205" class="line"/>
  <line x1="170" y1="250" x2="275" y2="258" class="line"/>
  <line x1="170" y1="260" x2="275" y2="365" class="line"/>
  <line x1="170" y1="270" x2="275" y2="425" class="line"/>
  <line x1="170" y1="280" x2="750" y2="365" class="line"/>
  <line x1="170" y1="290" x2="275" y2="560" class="line"/>

  <!-- Nhân viên -> 1.2 (cập nhật cá nhân), 1.3, 4.2 (đăng ký phép) -->
  <line x1="170" y1="465" x2="505" y2="210" class="line"/>
  <line x1="170" y1="475" x2="360" y2="280" class="line"/>
  <line x1="170" y1="485" x2="975" y2="370" class="line"/>

  <!-- Trưởng phòng -> 1.3 (tra cứu phòng mình), 4.3 (duyệt phép phòng mình) -->
  <line x1="1260" y1="330" x2="465" y2="260" class="line"/>
  <line x1="1260" y1="350" x2="940" y2="425" class="line"/>

  <!-- Ban giám đốc -> 2.3, 2.4 (QĐ bổ nhiệm/điều chuyển), 4.3 (duyệt phép quản lý), 5.1-5.4 (báo cáo) -->
  <line x1="1260" y1="510" x2="940" y2="258" class="line"/>
  <line x1="1260" y1="520" x2="970" y2="260" class="line"/>
  <line x1="1260" y1="535" x2="940" y2="430" class="line"/>
  <line x1="1260" y1="550" x2="1160" y2="560" class="line"/>

</svg>