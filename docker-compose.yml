services:
  db:
    image: postgres:16-alpine
    container_name: peopleops-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-peopleops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-peopleops_secret}
      POSTGRES_DB: ${POSTGRES_DB:-peopleops_hrms}
      TZ: Asia/Ho_Chi_Minh
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/src/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-peopleops} -d ${POSTGRES_DB:-peopleops_hrms}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: peopleops-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 5000
      DATABASE_URL: postgresql://${POSTGRES_USER:-peopleops}:${POSTGRES_PASSWORD:-peopleops_secret}@db:5432/${POSTGRES_DB:-peopleops_hrms}
      TZ: Asia/Ho_Chi_Minh
      # Backend chạy sau nginx trong mạng nội bộ nên tin X-Forwarded-For để giới hạn đăng nhập theo IP thật.
      TRUST_PROXY: 'true'
      # Đặt COOKIE_SECURE=true khi triển khai sau HTTPS.
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      # Mật khẩu tài khoản admin của dữ liệu mẫu (đổi trước khi triển khai thật).
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Demo@12345}
    ports:
      - "127.0.0.1:${BACKEND_PORT:-5000}:5000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: peopleops-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-3000}:80"

volumes:
  postgres_data:
